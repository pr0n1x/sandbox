[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"
description = "Run an app inside strict bubblewrap isolation, with a per-box home and an optional writable system layer"
license = "MIT"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
